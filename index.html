<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard | Bihar ITI</title>
  
  <!-- CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
  <script src="https://cdn.tailwindcss.com" crossorigin></script>
  <script src="https://unpkg.com/apexcharts@3.35.3/dist/apexcharts.min.js" crossorigin></script>
  <script src="https://unpkg.com/lucide@0.263.0/dist/umd/lucide.min.js" crossorigin></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js" crossorigin></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #F2F2F2; color: #282828; margin: 0; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .tab-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    @keyframes progress { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .animate-progress { animation: progress 1.5s infinite linear; }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#31B89D',
            'brand-green': '#31B89D',
            'brand-orange': '#FF9700',
            'brand-dark': '#282828',
            'brand-bg': '#F2F2F2'
          }
        }
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    /** SAFE STORAGE UTILITY **/
    const safeLocalStorage = {
      getItem: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
      setItem: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
      removeItem: (k) => { try { localStorage.removeItem(k); } catch (e) {} }
    };

    /** COMPONENT: LUCIDE ICON **/
    const LucideIcon = ({ name, className = "w-4 h-4", ...props }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide && iconRef.current) {
          window.lucide.createIcons({ attrs: { class: className }, nameAttr: 'data-lucide' });
        }
      }, [name, className]);
      return <i data-lucide={name} ref={iconRef} {...props}></i>;
    };

    /** COMPONENT: CHART WRAPPER **/
    const Chart = ({ options, series, type, height }) => {
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        if (!window.ApexCharts || !chartRef.current) return;
        const config = { ...options, series, chart: { ...options.chart, type, height, animations: { enabled: true } } };
        
        if (chartInstance.current) chartInstance.current.destroy();
        chartInstance.current = new window.ApexCharts(chartRef.current, config);
        chartInstance.current.render();

        return () => { if (chartInstance.current) chartInstance.current.destroy(); };
      }, [options, series, type, height]);

      return <div ref={chartRef} />;
    };

    /** UTILITY: FUZZY SEARCH MATCH **/
    const isMatch = (targetStr, query) => {
      if (!query) return true;
      const t = String(targetStr || '').toLowerCase().replace(/govt\s?iti/g, 'giti');
      const q = String(query).toLowerCase().replace(/govt\s?iti/g, 'giti');
      return t.includes(q);
    };

    /** COMPONENT: METRIC CARD **/
    const MetricCard = ({ title, value, icon, variant = 'green' }) => (
      <div className={`bg-white p-5 rounded-2xl border-2 transition-all hover:shadow-xl hover:-translate-y-1 ${variant === 'green' ? 'border-brand-green/20' : 'border-brand-orange/20'}`}>
        <div className="flex justify-between items-start mb-4">
          <h1 className={`text-[10px] font-black uppercase tracking-widest ${variant === 'green' ? 'text-brand-green' : 'text-brand-orange'}`}>{title}</h1>
          <LucideIcon name={icon} className={`w-5 h-5 ${variant === 'green' ? 'text-brand-green' : 'text-brand-orange'}`} />
        </div>
        <h2 className="text-3xl font-black text-brand-dark tracking-tighter">{value}</h2>
      </div>
    );

    /** MAIN DASHBOARD TAB **/
    const Dashboard = ({ data, onViewRegistry, lastSync }) => {
      const stats = useMemo(() => {
        const completed = data.filter(d => d.status === 'Completed').length;
        const muz = data.filter(d => String(d.division).toLowerCase().includes('muzaffarpur'));
        const pat = data.filter(d => String(d.division).toLowerCase().includes('patna'));
        return {
          total: data.length,
          completed,
          muz: `${muz.filter(d => d.status === 'Completed').length} / ${muz.length}`,
          pat: `${pat.filter(d => d.status === 'Completed').length} / ${pat.length}`
        };
      }, [data]);

      const chartOptions = {
        chart: { toolbar: { show: false } },
        colors: ['#31B89D', '#FF9700'],
        xaxis: { categories: ['Total', 'Completed'] },
        plotOptions: { bar: { borderRadius: 8, columnWidth: '40%' } }
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            <MetricCard title="Admissions" value={stats.total} icon="users" />
            <MetricCard title="Completed" value={stats.completed} icon="check-circle" />
            <MetricCard title="Muzaffarpur" value={stats.muz} icon="map-pin" variant="orange" />
            <MetricCard title="Patna" value={stats.pat} icon="trending-up" variant="orange" />
          </div>

          <div className="bg-white p-8 rounded-3xl border border-slate-200">
            <h3 className="text-xs font-black uppercase mb-6 flex items-center gap-2">
              <LucideIcon name="bar-chart" /> Performance Funnel
            </h3>
            <div className="h-64">
              <Chart 
                type="bar" 
                height="100%" 
                series={[{ name: 'Students', data: [stats.total, stats.completed] }]} 
                options={chartOptions} 
              />
            </div>
          </div>
        </div>
      );
    };

    /** APP CONTAINER **/
    const App = () => {
      const [activeTab, setActiveTab] = useState('overview');
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [lastSync, setLastSync] = useState(null);

      const fetchData = async () => {
        setLoading(true);
        // Sync with Google Apps Script Backend
        if (typeof google !== 'undefined') {
          google.script.run
            .withSuccessHandler((res) => {
              setData(res);
              setLastSync(new Date());
              setLoading(false);
            })
            .getSpreadsheetData();
        } else {
          // Mock data for local testing
          setTimeout(() => {
            setData([
              { firstName: 'Rahul', lastName: 'Kumar', college: 'GITI Muzaffarpur', status: 'Completed', division: 'Muzaffarpur', trade: 'Electrician', completedPercent: 100 },
              { firstName: 'Sita', lastName: 'Kumari', college: 'GITI Patna', status: 'In Progress', division: 'Patna', trade: 'Fitter', completedPercent: 45 }
            ]);
            setLoading(false);
          }, 1000);
        }
      };

      useEffect(() => { fetchData(); }, []);

      if (loading) return (
        <div className="h-screen flex flex-col items-center justify-center bg-brand-bg">
          <div className="w-12 h-12 border-4 border-brand-green border-t-transparent rounded-full animate-spin"></div>
          <p className="mt-4 text-[10px] font-black uppercase tracking-widest text-brand-green">Syncing Dataset...</p>
        </div>
      );

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-white p-8 border-b-4 border-brand-green flex justify-between items-center">
            <div>
              <h1 className="text-2xl font-black uppercase tracking-tighter text-brand-dark">AI Student <span className="text-brand-orange">Portal</span></h1>
              <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">Live Registration Tracking System</p>
            </div>
            <div className="hidden md:flex gap-4">
              <button onClick={() => setActiveTab('overview')} className={`px-6 py-2 rounded-xl text-[10px] font-black uppercase transition-all ${activeTab === 'overview' ? 'bg-brand-green text-white' : 'bg-slate-100'}`}>Overview</button>
              <button onClick={() => setActiveTab('registry')} className={`px-6 py-2 rounded-xl text-[10px] font-black uppercase transition-all ${activeTab === 'registry' ? 'bg-brand-green text-white' : 'bg-slate-100'}`}>Registry</button>
            </div>
          </header>

          <main className="flex-1 p-6 max-w-[1400px] mx-auto w-full">
            {activeTab === 'overview' ? (
              <Dashboard data={data} lastSync={lastSync} />
            ) : (
              <div className="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
                 <table className="w-full text-left">
                   <thead className="bg-slate-900 text-white text-[9px] font-black uppercase tracking-widest">
                     <tr>
                       <th className="px-6 py-4">Student Name</th>
                       <th className="px-6 py-4">College / ITI</th>
                       <th className="px-6 py-4">Trade</th>
                       <th className="px-6 py-4">Status</th>
                     </tr>
                   </thead>
                   <tbody>
                     {data.map((s, i) => (
                       <tr key={i} className="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                         <td className="px-6 py-4 font-bold text-xs uppercase">{s.firstName} {s.lastName}</td>
                         <td className="px-6 py-4 text-[11px] font-medium text-slate-500 uppercase">{s.college}</td>
                         <td className="px-6 py-4 text-[11px] font-bold uppercase">{s.trade}</td>
                         <td className="px-6 py-4">
                           <span className={`px-3 py-1 rounded-full text-[9px] font-black uppercase ${s.status === 'Completed' ? 'bg-brand-green/10 text-brand-green' : 'bg-brand-orange/10 text-brand-orange'}`}>
                             {s.status}
                           </span>
                         </td>
                       </tr>
                     ))}
                   </tbody>
                 </table>
              </div>
            )}
          </main>

          <footer className="p-4 bg-white border-t text-center text-[8px] font-black text-slate-400 uppercase tracking-[0.3em]">
            &copy; 2024 DSDA Bihar | Skill Platform
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
