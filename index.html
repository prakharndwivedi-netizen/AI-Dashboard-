<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/apexcharts@3.35.3/dist/apexcharts.min.js"></script>
  <script src="https://unpkg.com/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  
  <style>
    body { background-color: #F2F2F2; font-family: sans-serif; margin: 0; }
    .spinner { border: 4px solid rgba(0,0,0,0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #31B89D; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Stable Lucide Icon Component
    const Icon = ({ name, size = 16, color = "currentColor" }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} style={{ width: size, height: size, color: color }}></i>;
    };

    // Stable ApexChart Component
    const PerformanceChart = ({ data }) => {
      const chartRef = useRef(null);
      useEffect(() => {
        const completed = data.filter(d => d.status === 'Completed').length;
        const pending = data.length - completed;

        const options = {
          chart: { type: 'donut', height: 300 },
          series: [completed, pending],
          labels: ['Completed', 'Pending'],
          colors: ['#31B89D', '#FF9700'],
          legend: { position: 'bottom' }
        };

        const chart = new ApexCharts(chartRef.current, options);
        chart.render();
        return () => chart.destroy();
      }, [data]);

      return <div ref={chartRef}></div>;
    };

    const App = () => {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [view, setView] = useState('dashboard');

      useEffect(() => {
        // Fetch from Google Script
        if (typeof google !== 'undefined') {
          google.script.run
            .withSuccessHandler((res) => {
              setData(res);
              setLoading(false);
            })
            .withFailureHandler(() => {
              console.error("Failed to fetch data");
              setLoading(false);
            })
            .getSpreadsheetData();
        } else {
          // Local Testing Data
          setData([{ firstName: "Demo", lastName: "User", college: "Testing ITI", trade: "Electrician", status: "Completed", division: "Patna", completedPercent: 100 }]);
          setLoading(false);
        }
      }, []);

      if (loading) {
        return (
          <div className="flex flex-col items-center justify-center h-screen">
            <div className="spinner"></div>
            <p className="mt-4 text-sm font-bold text-gray-500 uppercase tracking-widest">Loading Analytics...</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          <nav className="bg-white border-b p-4 flex justify-between items-center shadow-sm">
            <h1 className="text-xl font-black text-gray-800 tracking-tighter uppercase">Student <span className="text-brand-green text-[#31B89D]">AI Portal</span></h1>
            <div className="flex gap-2">
              <button onClick={() => setView('dashboard')} className={`px-4 py-2 rounded-lg text-xs font-bold uppercase transition ${view === 'dashboard' ? 'bg-[#31B89D] text-white' : 'bg-gray-100 text-gray-500'}`}>Dashboard</button>
              <button onClick={() => setView('registry')} className={`px-4 py-2 rounded-lg text-xs font-bold uppercase transition ${view === 'registry' ? 'bg-[#31B89D] text-white' : 'bg-gray-100 text-gray-500'}`}>Registry</button>
            </div>
          </nav>

          <main className="p-6 max-w-6xl mx-auto w-full flex-1">
            {view === 'dashboard' ? (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="md:col-span-1 bg-white p-6 rounded-2xl border shadow-sm flex flex-col items-center">
                  <h3 className="text-xs font-black uppercase text-gray-400 mb-4">Completion Status</h3>
                  <PerformanceChart data={data} />
                </div>
                
                <div className="md:col-span-2 grid grid-cols-2 gap-4">
                  <div className="bg-white p-6 rounded-2xl border shadow-sm">
                    <p className="text-[10px] font-black text-gray-400 uppercase">Total Students</p>
                    <p className="text-4xl font-black text-gray-800">{data.length}</p>
                  </div>
                  <div className="bg-white p-6 rounded-2xl border shadow-sm">
                    <p className="text-[10px] font-black text-gray-400 uppercase">Total Completed</p>
                    <p className="text-4xl font-black text-[#31B89D]">{data.filter(d => d.status === 'Completed').length}</p>
                  </div>
                  <div className="bg-white p-6 rounded-2xl border shadow-sm col-span-2">
                    <p className="text-[10px] font-black text-gray-400 uppercase mb-2">Platform Status</p>
                    <div className="flex items-center gap-2 text-green-500 font-bold text-sm">
                      <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                      Database Synced Successfully
                    </div>
                  </div>
                </div>
              </div>
            ) : (
              <div className="bg-white rounded-2xl border overflow-hidden shadow-sm">
                <table className="w-full text-left">
                  <thead className="bg-gray-50 border-b text-[10px] font-black uppercase text-gray-400">
                    <tr>
                      <th className="px-6 py-4">Name</th>
                      <th className="px-6 py-4">College</th>
                      <th className="px-6 py-4">Trade</th>
                      <th className="px-6 py-4">Status</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y text-sm">
                    {data.map((item, i) => (
                      <tr key={i} className="hover:bg-gray-50 transition">
                        <td className="px-6 py-4 font-bold text-gray-700">{item.firstName} {item.lastName}</td>
                        <td className="px-6 py-4 text-gray-500">{item.college}</td>
                        <td className="px-6 py-4 text-gray-500">{item.trade}</td>
                        <td className="px-6 py-4">
                          <span className={`px-3 py-1 rounded-full text-[10px] font-black uppercase ${item.status === 'Completed' ? 'bg-green-100 text-green-600' : 'bg-orange-100 text-orange-600'}`}>
                            {item.status}
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </main>

          <footer className="p-6 text-center text-[10px] font-black text-gray-300 uppercase tracking-[0.3em]">
            Data Source: Google Sheets | Bihar DSDA &copy; 2024
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
