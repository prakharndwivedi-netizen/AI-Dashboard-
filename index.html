  <base target="_top">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CDNs -->

  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      console.warn('Global Error caught:', msg, 'at', url, 'line:', lineNo, 'col:', columnNo);
      // Suppress cross-origin CORS mask "Script error." and websocket HMR notifications which are benign
      if (typeof msg === 'string' && (msg.toLowerCase().includes('script error') || msg.toLowerCase().includes('websocket'))) {
        return true; 
      }
      return false;
    };
  </script>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<body>
  <div id="root"></div>

  <script>
    if (window.Babel) {
      Babel.registerPreset('custom-babel-preset', {
        presets: [
          [Babel.availablePresets['env'], {}],
          [Babel.availablePresets['react'], { runtime: 'classic' }]
        ]
      });
    }
  </script>

  <script type="text/babel" data-presets="custom-babel-preset">
    const { useState, useMemo, useEffect, useRef } = React;

    const safeLocalStorage = {
      getItem(key) {
        try {
          return localStorage.getItem(key);
        } catch (e) {
          console.warn("Storage warning: Reading localStorage is blocked or unavailable.", e);
          return null;
        }
      },
      setItem(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (e) {
          console.warn("Storage warning: Writing to localStorage is blocked or unavailable.", e);
        }
      },
      removeItem(key) {
        try {
          localStorage.removeItem(key);
        } catch (e) {
          console.warn("Storage warning: Removing from localStorage is blocked or unavailable.", e);
        }
      }
    };

    const getIconSvg = (name, className = "w-4 h-4") => {
      try {
        if (!name || typeof name !== 'string') return '';
        if (!window.lucide || !window.lucide.icons) return '';
        // Map kebab-case to PascalCase (e.g., 'map-pin' to 'MapPin', 'search' to 'Search')
        const pascalName = name
          .split('-')
          .map(part => part.charAt(0).toUpperCase() + part.slice(1))
          .join('');
        
        // Try PascalCase first, then lowercase, then original string
        const iconObj = window.lucide.icons[pascalName] || 
                        window.lucide.icons[name.toLowerCase()] || 
                        window.lucide.icons[name];
                        
        if (iconObj && typeof iconObj.toSVG === 'function') {
          // Define default attributes to match the design style
          const defaultAttrs = {
            class: className,
            width: '100%',
            height: '100%',
            'stroke-width': '2'
          };
          return iconObj.toSVG(defaultAttrs);
        }
      } catch (e) {
        console.error("Error creating SVG icon:", name, e);
      }
      return '';
    };

    const LucideIcon = ({ name, className = "w-4 h-4", ...props }) => {
      const [libLoaded, setLibLoaded] = useState(!!(window.lucide && window.lucide.icons));

      useEffect(() => {
        if (!libLoaded) {
          const timer = setInterval(() => {
            if (window.lucide && window.lucide.icons) {
              setLibLoaded(true);
              clearInterval(timer);
            }
          }, 100);
          return () => clearInterval(timer);
        }
      }, [libLoaded]);

      const svgString = useMemo(() => {
        if (!libLoaded) return '';
        return getIconSvg(name, className);
      }, [name, className, libLoaded]);

      if (!svgString) {
        // Safe fallback - if Lucide library is not loaded yet, degrade gracefully
        return <span className={`inline-block shrink-0 ${className} select-none`} data-lucide={name} {...props}></span>;
      }

      return (
        <span 
          className={`inline-flex items-center justify-center shrink-0 select-none cursor-inherit ${className}`}
          dangerouslySetInnerHTML={{ __html: svgString }}
          {...props}
        />
      );
    };
    
    /**
     * GITHUB HOSTING OPTIMIZATION:
     * To host this on GitHub and pull live data from Google Sheets:
     * 1. In your Google Sheet, go to File > Share > Publish to web.
     * 2. Select 'Entire Document' and 'Comma-separated values (.csv)'.
     * 3. Copy the link and paste it below in GOOGLE_SHEET_CSV_URL.
     */
    const GOOGLE_SHEET_CSV_URL = "/api/data"; 

    // --- MANUAL APEX CHARTS BRIDGE ---
    const Chart = (props) => {
      const chartRef = React.useRef(null);
      const chartInstance = React.useRef(null);
      const [libFound, setLibFound] = useState(!!window.ApexCharts);

      useEffect(() => {
        if (!libFound) {
          const interval = setInterval(() => {
            if (window.ApexCharts) {
              setLibFound(true);
              clearInterval(interval);
            }
          }, 500);
          return () => clearInterval(interval);
        }
      }, [libFound]);

      // Seamless update of options and series without recreating the DOM element, preventing flicker
      useEffect(() => {
        if (!libFound || !chartRef.current) return;

        let active = true;

        const initOrUpdateChart = () => {
          if (!chartRef.current || !active) return;

          const config = {
            ...(props.options || {}),
            series: props.series,
            chart: {
              ...(props.options?.chart || {}),
              type: props.type || 'line',
              height: props.height || 'auto',
              animations: { enabled: true }
            }
          };

          if (chartInstance.current) {
            try {
              chartInstance.current.updateOptions(config, false, true);
            } catch (e) {
              console.warn("ApexCharts updateOptions failed, recreating...", e);
              try {
                chartInstance.current.destroy();
              } catch (destErr) {}
              try {
                chartInstance.current = new window.ApexCharts(chartRef.current, config);
                chartInstance.current.render();
              } catch (createErr) {
                console.error("ApexCharts recreate failed", createErr);
              }
            }
          } else {
            try {
              chartInstance.current = new window.ApexCharts(chartRef.current, config);
              chartInstance.current.render();
            } catch (e) {
              console.error("ApexCharts render failed", e);
            }
          }
        };

        const timeout = setTimeout(initOrUpdateChart, 50);

        return () => {
          active = false;
          clearTimeout(timeout);
        };
      }, [libFound, props.options, props.series, props.type, props.height]);

      useEffect(() => {
        return () => {
          if (chartInstance.current) {
            try {
              chartInstance.current.destroy();
            } catch (e) {
              console.warn("ApexCharts cleanup destroy failed", e);
            }
            chartInstance.current = null;
          }
        };
      }, []);

      if (!libFound) {
        return (
          <div className="h-full w-full bg-slate-50 flex flex-col items-center justify-center border border-dashed border-slate-200 rounded-lg p-4">
            <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Loading Graphics...</span>
          </div>
        );
      }

      return <div ref={chartRef} className="w-full h-full" />;
    };

    // --- UTILITIES ---
    const isMatch = (collegeName, searchQuery) => {
      if (!searchQuery) return true;
      const target = String(collegeName || '').toLowerCase().trim();
      const query = String(searchQuery || '').toLowerCase().trim();
      if (!query) return true;

      // Define a normalization function for abbreviation translation
      const normalizeAbbreviations = (text) => {
        let t = text;
        
        // Replace forms of government/govt iti with giti
        t = t.replace(/\bgovernment\s+iti\b/g, 'giti');
        t = t.replace(/\bgovt\s+iti\b/g, 'giti');
        t = t.replace(/\bgov\s+iti\b/g, 'giti');
        // Replace isolated terms so that "govt iti" search query works
        t = t.replace(/\bgovernment\b/g, 'giti');
        t = t.replace(/\bgovt\b/g, 'giti');
        t = t.replace(/\bgov\b/g, 'giti');
        
        // Replace forms of womens/women's iti with witi
        t = t.replace(/\bwomen\'s\s+iti\b/g, 'witi');
        t = t.replace(/\bwomens\s+iti\b/g, 'witi');
        t = t.replace(/\bwomen\s+iti\b/g, 'witi');
        t = t.replace(/\bwomen\'s\b/g, 'witi');
        t = t.replace(/\bwomens\b/g, 'witi');
        t = t.replace(/\bwomen\b/g, 'witi');
        
        // Clean special characters and multiple spaces
        t = t.replace(/[^a-z0-9\s]/g, ' ');
        t = t.replace(/\s+/g, ' ').trim();
        return t;
      };

      const normTarget = normalizeAbbreviations(target);
      const normQuery = normalizeAbbreviations(query);

      // 1. Direct contains check on normalized text
      if (normTarget.includes(normQuery)) return true;

      // 2. Word-by-word fuzzy spelling tolerance check
      const targetWords = normTarget.split(' ').filter(Boolean);
      const queryWords = normQuery.split(' ').filter(Boolean);

      if (queryWords.length === 0) return true;

      // Simple Levenshtein distance
      const getLevenshteinDistance = (a, b) => {
        const matrix = [];
        for (let i = 0; i <= b.length; i++) matrix[i] = [i];
        for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
        for (let i = 1; i <= b.length; i++) {
          for (let j = 1; j <= a.length; j++) {
            if (b.charAt(i - 1) === a.charAt(j - 1)) {
              matrix[i][j] = matrix[i - 1][j - 1];
            } else {
              matrix[i][j] = Math.min(
                matrix[i - 1][j - 1] + 1, // substitution
                matrix[i][j - 1] + 1,     // insertion
                matrix[i - 1][j] + 1      // deletion
              );
            }
          }
        }
        return matrix[b.length][a.length];
      };

      const isWordClose = (qw, tw) => {
        if (tw.includes(qw)) return true;
        if (qw.includes(tw)) return true;
        
        if (qw.length < 3) return qw === tw;
        const maxDist = qw.length <= 4 ? 1 : 2;
        return getLevenshteinDistance(qw, tw) <= maxDist;
      };

      // Ensure every word in query matches at least one word in target
      return queryWords.every(qw => targetWords.some(tw => isWordClose(qw, tw)));
    };

    const getAggregatedMetrics = (records) => {
      const registrations = records.length;
      
      const isCompleted = (r) => {
        const val = parseFloat(r.completedPercent);
        return (!isNaN(val) && val >= 100) || r.status === 'Completed';
      };

      const completions = records.filter(isCompleted).length;
      
      const muzRecords = records.filter(r => String(r.division || '').toLowerCase().includes('muzaffarpur'));
      const muzTotal = muzRecords.length;
      const muzCompleted = muzRecords.filter(isCompleted).length;

      const patnaRecords = records.filter(r => String(r.division || '').toLowerCase().includes('patna'));
      const patnaTotal = patnaRecords.length;
      const patnaCompleted = patnaRecords.filter(isCompleted).length;

      // Last 30 Days Logic
      const thirtyDaysAgo = new Date();
      thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
      
      const recentRegs = records.filter(r => {
        if (!r.startedAt) return false;
        const d = new Date(r.startedAt);
        return d >= thirtyDaysAgo;
      }).length;

      const recentComps = records.filter(r => {
        if (!r.completedAt) return false;
        const d = new Date(r.completedAt);
        return d >= thirtyDaysAgo && r.completedPercent >= 100;
      }).length;

      return {
        registrations,
        completions,
        muzProgress: `${muzCompleted} / ${muzTotal}`,
        patnaProgress: `${patnaCompleted} / ${patnaTotal}`,
        recentRegs,
        recentComps,
        stability: "100%",
        hasData: records.length > 0
      };
    };

    const getDistribution = (records, field) => {
      const counts = {};
      records.forEach(r => {
        let val = String(r[field] || '').trim();
        // Skip placeholders but allow meaningful data
        if (!val || ['n/a', 'unknown', 'undefined', 'unassigned', 'not specified'].includes(val.toLowerCase())) return;
        counts[val] = (counts[val] || 0) + 1;
      });
      
      const result = Object.entries(counts)
        .map(([name, value]) => ({ name, value }))
        .sort((a, b) => b.value - a.value);
      
      return result.length > 0 ? result : [{ name: 'No Specific Data', value: 0 }];
    };

    const getCollegeMetrics = (records) => {
      const thirtyDaysAgo = new Date();
      thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
      
      const colleges = {};
      records.forEach(r => {
        const name = r.college || 'N/A';
        if (!colleges[name]) colleges[name] = { registrations: 0, completions: 0, recentCompletions: 0 };
        
        colleges[name].registrations++;
        const pComp = parseFloat(r.completedPercent);
        const isComp = (!isNaN(pComp) && pComp >= 100) || r.status === 'Completed';
        if (isComp) {
          colleges[name].completions++;
          
          if (r.completedAt) {
            const compDate = new Date(r.completedAt);
            if (compDate >= thirtyDaysAgo) {
              colleges[name].recentCompletions++;
            }
          }
        }
      });
      
      return Object.entries(colleges)
        .map(([name, stats]) => ({ 
          name, 
          ...stats, 
          efficiency: stats.registrations > 0 ? ((stats.completions / stats.registrations) * 100).toFixed(1) : "0.0"
        }))
        .sort((a, b) => b.registrations - a.registrations);
    };

    const getRecentPerformance = (records) => {
      const thirtyDaysAgo = new Date();
      thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
      
      const stats = {};
      records.filter(r => r.startedAt || r.completedAt).forEach(r => {
        const regDate = r.startedAt ? new Date(r.startedAt) : null;
        const compPercent = parseFloat(r.completedPercent) || 0;
        const compDate = (r.completedAt && compPercent >= 100) ? new Date(r.completedAt) : null;
        
        const college = r.college || 'N/A';
        if (!stats[college]) stats[college] = { newRegs: 0, newComps: 0 };
        
        if (regDate && regDate >= thirtyDaysAgo) stats[college].newRegs++;
        if (compDate && compDate >= thirtyDaysAgo) stats[college].newComps++;
      });
      
      return Object.entries(stats)
        .map(([name, val]) => ({ name, ...val }))
        .sort((a, b) => b.newRegs - a.newRegs);
    };

    const maskSensitive = (val) => {
      if (!val) return val;
      const str = String(val).trim();
      if (str.includes('@')) {
        // Email masking
        try {
          const [username, domain] = str.split('@');
          if (username.length <= 2) return str;
          const first = username[0];
          const last = username[username.length - 1];
          const maskedContent = "*".repeat(username.length - 2);
          return `${first}${maskedContent}${last}@${domain}`;
        } catch (e) {
          return str;
        }
      } else {
        // Phone masking (assuming numeric-like)
        const digits = str.replace(/\D/g, '');
        if (digits.length < 5) return str; // Too short to mask meaningfully
        const first = str[0];
        const last = str[str.length - 1];
        const maskedContent = "*".repeat(str.length - 2);
        return `${first}${maskedContent}${last}`;
      }
    };

    const maskEmail = maskSensitive; // Alias for backward compatibility

    const GOALS_MOCK = [
      { institution: "ITI Narkatiyaganj", totalAdmissions: 200, registered: 180, totalCompleted: 150 },
      { institution: "ITI Jhanjharpur", totalAdmissions: 150, registered: 140, totalCompleted: 110 },
      { institution: "WITI Muzaffarpur", totalAdmissions: 100, registered: 95, totalCompleted: 90 },
      { institution: "ITI Hajipur", totalAdmissions: 180, registered: 160, totalCompleted: 130 },
      { institution: "ITI Hathwa", totalAdmissions: 120, registered: 110, totalCompleted: 80 },
    ];

    // --- COMPONENTS ---

    const MetricCard = ({ title, value, icon, variant = 'green' }) => (
      <div className={`w-full overflow-hidden relative group h-[110px] rounded-2xl border-2 transition-all hover:shadow-xl hover:-translate-y-1 cursor-default ${
        variant === 'green' 
          ? 'bg-white border-brand-green/20 hover:border-brand-green/40' 
          : 'bg-white border-brand-orange/20 hover:border-brand-orange/40'
      }`}>
        <div className={`absolute top-0 right-0 w-24 h-24 blur-2xl rounded-full opacity-10 transition-opacity group-hover:opacity-20 ${
          variant === 'green' ? 'bg-brand-green' : 'bg-brand-orange'
        }`}></div>
        
        <div className="relative p-5 h-full flex flex-col justify-between">
          <div className="flex justify-between items-start">
            <h1 className={`text-[10px] font-black uppercase tracking-[0.15em] ${variant === 'green' ? 'text-brand-green' : 'text-brand-orange'}`}>{title}</h1>
            <div className={`p-2 rounded-xl ${variant === 'green' ? 'bg-brand-green/10' : 'bg-brand-orange/10'}`}>
              <LucideIcon name={icon} className={`w-4 h-4 ${variant === 'green' ? 'text-brand-green' : 'text-brand-orange'}`} />
            </div>
          </div>
          <div className="flex items-baseline gap-2">
            <h2 className="text-3xl font-black text-brand-dark tracking-tighter">{value}</h2>
          </div>
        </div>
      </div>
    );



    const Dashboard = ({ data, onViewRegistry, onViewProgressRegistry, lastSync, isLive }) => {
      const [selectedDivision, setSelectedDivision] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [reportSearch, setReportSearch] = useState('');
      const [reportCollege, setReportCollege] = useState(null);
      const [showSuggestions, setShowSuggestions] = useState(false);

      const searchContainerRef = useRef(null);

      useEffect(() => {
        const handleClickOutside = (event) => {
          if (searchContainerRef.current && !searchContainerRef.current.contains(event.target)) {
            setShowSuggestions(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const divisions = useMemo(() => {
        const unique = Array.from(new Set(data.filter(d => d.division).map(d => d.division)));
        return ['All', ...unique.sort()];
      }, [data]);

      const uniqueColleges = useMemo(() => {
        return Array.from(new Set(data.map(d => d.college).filter(Boolean)));
      }, [data]);

      const suggestions = useMemo(() => {
        if (!searchQuery.trim()) return [];
        const matches = uniqueColleges.filter(colName => {
          if (colName.toLowerCase() === searchQuery.toLowerCase().trim()) return false;
          return isMatch(colName, searchQuery);
        });
        return matches.slice(0, 5);
      }, [uniqueColleges, searchQuery]);

      const filteredData = useMemo(() => {
        return data.filter(record => {
          const matchDivision = selectedDivision === 'All' || record.division === selectedDivision;
          const matchSearch = isMatch(record.college, searchQuery);
          return matchDivision && matchSearch;
        });
      }, [data, selectedDivision, searchQuery]);

      const metrics = useMemo(() => getAggregatedMetrics(filteredData), [filteredData]);
      const collegeMetrics = useMemo(() => getCollegeMetrics(filteredData), [filteredData]);
      
      const filteredReportMetrics = useMemo(() => {
        return collegeMetrics.filter(col => 
          col.name.toLowerCase().includes(reportSearch.toLowerCase())
        );
      }, [collegeMetrics, reportSearch]);

      const top10Colleges = useMemo(() => {
        return [...collegeMetrics]
          .sort((a, b) => b.completions - a.completions)
          .slice(0, 10);
      }, [collegeMetrics]);

      const bottom10Colleges = useMemo(() => {
        return collegeMetrics
          .filter(c => {
            const eff = parseFloat(c.efficiency);
            // Include only colleges with actual registration counts and low efficiency
            return c.registrations > 0 && eff >= 0 && eff <= 50;
          })
          .sort((a, b) => {
            const effA = parseFloat(a.efficiency);
            const effB = parseFloat(b.efficiency);
            if (effA !== effB) {
              return effA - effB; // Worst performing first
            }
            return b.registrations - a.registrations; // If same efficiency, show larger student body first
          })
          .slice(0, 10);
      }, [collegeMetrics]);

      const recentPerformance = useMemo(() => getRecentPerformance(filteredData), [filteredData]);

      // NEW COMPLETIONS-FOCUSED INSIGHTS DISTRIBUTIONS
      const tradeCompletions = useMemo(() => {
        const trades = {};
        filteredData.forEach(r => {
          const trade = r.trade || 'Other';
          if (!trades[trade]) {
            trades[trade] = { registrations: 0, completions: 0 };
          }
          trades[trade].registrations++;
          const pComp = parseFloat(r.completedPercent);
          const isComp = (!isNaN(pComp) && pComp >= 100) || r.status === 'Completed';
          if (isComp) {
            trades[trade].completions++;
          }
        });

        return Object.entries(trades)
          .map(([name, stats]) => {
            const rate = stats.registrations > 0 ? (stats.completions / stats.registrations) * 100 : 0;
            return { name, ...stats, rate: parseFloat(rate.toFixed(1)) };
          })
          .filter(t => t.registrations > 0)
          .sort((a, b) => b.rate - a.rate || b.registrations - a.registrations)
          .slice(0, 6); // Top 6 trades
      }, [filteredData]);

      const districtCompletions = useMemo(() => {
        const districts = {};
        filteredData.forEach(r => {
          const dist = r.district || 'Unassigned';
          if (!districts[dist]) {
            districts[dist] = { registrations: 0, completions: 0 };
          }
          districts[dist].registrations++;
          const pComp = parseFloat(r.completedPercent);
          const isComp = (!isNaN(pComp) && pComp >= 100) || r.status === 'Completed';
          if (isComp) {
            districts[dist].completions++;
          }
        });

        return Object.entries(districts)
          .map(([name, stats]) => ({
            name,
            ...stats
          }))
          .filter(d => d.completions > 0)
          .sort((a, b) => b.completions - a.completions)

              const d = new Date(r.completedAt);

                monthCounts[label] = (monthCounts[label] || 0) + 1;
              }

            }
          }

            const parseDate = new Date(month);
            return { month, count, sortTime: parseDate.getTime() || 0 };

            countLow++;
          } else if (pComp > 50 && pComp <= 70) {
            countMid++;
          } else if (pComp > 70 && pComp < 100) {
            countHigh++;
          } else {
            countCompleted++;

        });

    const downloadCSV = (data, filename) => {
      if (data.length === 0) return;
      const headers = ['firstName', 'lastName', 'college', 'division', 'district', 'trade', 'status', 'completedPercent', 'completedAt'];
      const headerNames = ['firstName', 'lastName', 'college', 'division', 'district', 'trade', 'status', 'completedPercent', 'completed At'];
      const csvRows = [];
      csvRows.push(headerNames.join(','));
      
      for (const row of data) {
        const values = headers.map(header => {
          const val = row[header] === undefined || row[header] === null ? '' : row[header];
          const escaped = ('' + val).replace(/"/g, '""');
          return `"${escaped}"`;
        });
        csvRows.push(values.join(','));
      }
      
      const csvString = csvRows.join('\n');
      const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      if (link.download !== undefined) {
        const url = URL.createObjectURL(blob);
        link.setAttribute('href', url);
        link.setAttribute('download', filename);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    };

    const loadScript = (src) => {
      return new Promise((resolve, reject) => {
        const existing = document.querySelector(`script[src="${src}"]`);
        if (existing) {
          if (existing.getAttribute('data-loaded') === 'true') {
            resolve();
            return;
          }
          existing.addEventListener('load', () => resolve());
          existing.addEventListener('error', (err) => reject(err));
          return;
        }
        const script = document.createElement('script');
        script.src = src;
        script.crossOrigin = 'anonymous';
        script.onload = () => {
          script.setAttribute('data-loaded', 'true');
          resolve();
        };
        script.onerror = () => reject(new Error(`Failed to load script: ${src}`));
        document.head.appendChild(script);
      });
    };

    const downloadPDF = async (data, filename) => {
      if (data.length === 0) return;
      
      let jsPDFClass = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
      if (!jsPDFClass) {
        try {
          await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
          await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js");
          jsPDFClass = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
        } catch (err) {
          console.error("Error loading PDF libraries dynamically:", err);
          return;
        }
      }
      
      if (!jsPDFClass) {
        console.error("PDF class not found. Make sure the library is fully loaded.");
        return;
      }
      
      const doc = new jsPDFClass({ orientation: 'landscape', format: 'a4' });
      
      doc.setFont("helvetica", "bold");
      doc.setFontSize(16);
      doc.setTextColor(18, 49, 76);
      doc.text("Medha Student Registration Registry Report", 14, 15);
      
      doc.setFont("helvetica", "normal");

      doc.text(`Generated: ${new Date().toLocaleString()} | Total Records: ${data.length}`, 14, 21);
      
      const headers = [['First Name', 'Last Name', 'College', 'Division', 'District', 'Trade', 'Status', 'Progress (%)', 'Completed At']];
      const rows = data.map(item => [
        item.firstName || '',
        item.lastName || '',

        item.division || '',
        item.district || '',
        item.trade || '',
        item.status || '',
        `${item.completedPercent || 0}%`,
        item.completedAt || 'N/A'
      ]);
      
      doc.autoTable({
        startY: 25,
        head: headers,
        body: rows,
        theme: 'striped',
        styles: { fontSize: 7, cellPadding: 2, overflow: 'linebreak' },
        headStyles: { fillColor: [18, 49, 76], textColor: [255, 255, 255], fontStyle: 'bold' },
        columnStyles: {
          0: { cellWidth: 25 },

          4: { cellWidth: 25 },
          5: { cellWidth: 35 },
          6: { cellWidth: 20 },
          7: { cellWidth: 15 },
          8: { cellWidth: 25 }
        },
        alternateRowStyles: { fillColor: [248, 250, 252] },
        margin: { top: 25, left: 14, right: 14, bottom: 15 },
        didDrawPage: function(dataDraw) {
          const pageCount = doc.internal.getNumberOfPages();
          doc.setFont("helvetica", "normal");
          doc.setFontSize(8);
          doc.setTextColor(148, 163, 184);
          doc.text(`Page ${dataDraw.pageNumber} of ${pageCount}`, doc.internal.pageSize.width - 25, doc.internal.pageSize.height - 8);
        }
      });
      
      doc.save(filename);
    };

    const App = () => {
      const [activeTab, setActiveTab] = useState('overview');
      const [registryFilter, setRegistryFilter] = useState(() => safeLocalStorage.getItem('registryFilter') || '');
      const [progressRangeFilter, setProgressRangeFilter] = useState(() => safeLocalStorage.getItem('progressRangeFilter') || 'All');

      useEffect(() => {
        safeLocalStorage.setItem('registryFilter', registryFilter || '');
      }, [registryFilter]);

      useEffect(() => {
        safeLocalStorage.setItem('progressRangeFilter', progressRangeFilter || 'All');
      }, [progressRangeFilter]);

      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [lastSync, setLastSync] = useState(null);
      const [isLive, setIsLive] = useState(false);
      const safeData = useMemo(() => Array.isArray(data) ? data : [], [data]);

      const parseMonthYear = (dateStr) => {
        if (!dateStr) return null;
        
        let str = String(dateStr).trim().replace(/\s+/g, ' ');
        if (!str || str.toLowerCase() === 'not specified' || str.toLowerCase() === 'null' || str.toLowerCase() === 'undefined') {
          return null;
        }

        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const fullMonthNames = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];

        // Try to match wordy months first
        // Example: "27-Nov-23" or "27-Nov-2023" or "27 Nov 2023" or "27-November-2023"
        let normalizedStr = str.replace(/[-/]/g, ' ').toLowerCase();
        let words = normalizedStr.split(' ');
        
        let foundMonthIndex = -1;
        for (let i = 0; i < words.length; i++) {
          const w = words[i];
          const idxFull = fullMonthNames.indexOf(w);
          if (idxFull !== -1) {
            foundMonthIndex = idxFull;
            break;
          }
          const idxShort = monthNames.map(m => m.toLowerCase()).indexOf(w.substring(0, 3));
          if (idxShort !== -1 && w.length >= 3) {
            foundMonthIndex = idxShort;
            break;
          }
        }

        if (foundMonthIndex !== -1) {
          let year = null;
          for (const w of words) {
            if (/^\d{4}$/.test(w)) {
              year = parseInt(w);
              break;
            }
          }
          if (year === null) {
            for (const w of words) {
              if (/^\d{2}$/.test(w) && !/^\d{4}$/.test(w)) {
                const val = parseInt(w);
                year = 2000 + val;
                break;
              }
            }
          }
          if (year !== null) {
            return {
              label: `${monthNames[foundMonthIndex]}-${String(year).slice(-2)}`,
              raw: `${year}-${String(foundMonthIndex + 1).padStart(2, '0')}`
            };
          }
        }

        // Match YYYY-MM-DD or YYYY/MM/DD
        let matchISO = str.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
        if (matchISO) {
          const year = parseInt(matchISO[1]);
          const month = parseInt(matchISO[2]) - 1;
          if (month >= 0 && month < 12) {
            return { label: `${monthNames[month]}-${String(year).slice(-2)}`, raw: `${year}-${String(month+1).padStart(2, '0')}` };
          }
        }

        // Match numeric digits: DD/MM/YYYY, DD-MM-YYYY, MM/DD/YYYY, MM-DD-YYYY
        let matchNumeric = str.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{2,4})/);
        if (matchNumeric) {
          const num1 = parseInt(matchNumeric[1]);
          const num2 = parseInt(matchNumeric[2]);
          let year = parseInt(matchNumeric[3]);
          if (year < 100) year += 2000;

          if (num1 > 12 && num2 <= 12) {
            const month = num2 - 1;
            return { label: `${monthNames[month]}-${String(year).slice(-2)}`, raw: `${year}-${String(month+1).padStart(2, '0')}` };
          } else if (num2 > 12 && num1 <= 12) {
            const month = num1 - 1;
            return { label: `${monthNames[month]}-${String(year).slice(-2)}`, raw: `${year}-${String(month+1).padStart(2, '0')}` };
          } else if (num1 <= 12 && num2 <= 12) {
            const month = num2 - 1;
            return { label: `${monthNames[month]}-${String(year).slice(-2)}`, raw: `${year}-${String(month+1).padStart(2, '0')}` };
          }
        }

        // Native Date parser fallback
        const date = new Date(str);
        if (!isNaN(date.getTime())) {
          const year = date.getFullYear();
          const month = date.getMonth();
          return { label: `${monthNames[month]}-${String(year).slice(-2)}`, raw: `${year}-${String(month+1).padStart(2, '0')}` };
        }
        
        return null;
      };

                        }

                        const statusStr = String(obj.status || '').toLowerCase();
                        const finalized = (statusStr.includes('complete') || statusStr.includes('finish') || completedValue >= 100);

                        return {
                          id: index + 1,
                          firstName: obj.firstname || (typeof obj.studentname === 'string' ? obj.studentname.split(' ')[0] : '') || "Student",
                          lastName: obj.lastname || (typeof obj.studentname === 'string' ? obj.studentname.split(' ').slice(1).join(' ') : '') || `#${index+1}`,
                          email: obj.email || obj.emailid || '',

                          trade: obj.trade || obj.tradename || obj.subject || '',

                          incomeLevel: obj.incomelevel || obj.familyincome || 'Not Specified',

                            const dateKeys = ['startedat', 'registrationdate', 'timestamp', 'createdat', 'submissiondate', 'date', 'datetime', 'enrolledat', 'enrollmentdate', 'joiningdate', 'startingdate'];

                              (k.includes('date') || k.includes('time') || k.endsWith('at') || k.startsWith('start')) &&
